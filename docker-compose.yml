services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  java-tools:
    build: ./java-tools
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["8081:8081"]

  python-copilot:
    build: ./python-copilot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      REDIS_URL: redis://redis:6379/0
      JAVA_MCP_URL: http://java-tools:8081/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      java-tools:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml
    ports: ["4318:4318"]
